services:
  # Node.js Application (Horizontally Scalable)
  app:
    build: .
    # Removed container_name to allow scaling (--scale app=N)
    restart: always
    ports:
      - "${HOST_APP_PORT}:${PORT}"
    # Mount the source so edits on host are visible inside container
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - BINANCE_INGESTION_ENABLED=${BINANCE_INGESTION_ENABLED}
      - BINANCE_INGESTION_SYMBOL=${BINANCE_INGESTION_SYMBOL}
      - BINANCE_THROTTLE_MS=${BINANCE_THROTTLE_MS}
    depends_on:
      - postgres
      - redis
    command: [ "npm", "run", "dev" ]
    networks:
      - twocents-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: twocents-postgres
    restart: always
    ports:
      - "${HOST_POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - twocents-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: twocents-redis
    restart: always
    ports:
      - "${HOST_REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - twocents-network

  # Redis Commander - Redis Visualization
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: twocents-redis-commander
    restart: always
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - twocents-network

  # Prisma Studio - PostgreSQL Visualization
  prisma-studio:
    build: .
    container_name: twocents-prisma-studio
    restart: always
    command: npx prisma studio --port 5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - HOST=0.0.0.0
      - BROWSER=none
    depends_on:
      - postgres
    networks:
      - twocents-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: twocents-nginx
    restart: always
    ports:
      - "${HOST_NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - twocents-network

volumes:
  postgres-data:
  redis-data:

networks:
  twocents-network:
    driver: bridge
