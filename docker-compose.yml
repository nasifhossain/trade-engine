services:
  # Node.js Application (Horizontally Scalable)
  app:
    build: .
    # Removed container_name to allow scaling (--scale app=N)
    restart: always
    ports:
      - "${HOST_APP_PORT}:${PORT}"
    # Mount the source so edits on host are visible inside container
    volumes:
      - ./:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - mysql
      - redis
    command: ["npm", "run", "dev"]
    networks:
      - twocents-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: twocents-mysql
    restart: always
    ports:
      - "${HOST_MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - twocents-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: twocents-redis
    restart: always
    ports:
      - "${HOST_REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - twocents-network

  # phpMyAdmin for MySQL Visualization
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: twocents-phpmyadmin
    restart: always
    ports:
      - "${HOST_PHPMYADMIN_PORT:-8081}:80"
    environment:
      - PMA_HOST=${MYSQL_HOST}
      - PMA_PORT=3306
      - PMA_USER=${MYSQL_USER}
      - PMA_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - twocents-network

  # Redis Commander for Redis Visualization
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: twocents-redis-commander
    restart: always
    ports:
      - "${HOST_REDIS_COMMANDER_PORT:-8082}:8081"
    environment:
      - REDIS_HOSTS=local:${REDIS_HOST}:${REDIS_PORT}
    depends_on:
      - redis
    networks:
      - twocents-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: twocents-nginx
    restart: always
    ports:
      - "${HOST_NGINX_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - twocents-network

volumes:
  mysql-data:
  redis-data:

networks:
  twocents-network:
    driver: bridge

